<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIRO PROJECT</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0A0A0A;
            --surface: #111111;
            --text: #EDEDEC;
            --text-muted: #6E6D6A;
            --border: #1F1F1F;
            --accent: #A0A0A0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Cursor spotlight */
        .spotlight {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            transform: translate(-50%, -50%);
            transition: opacity 0.3s ease;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
            padding: 80px 24px;
        }

        /* Hero */
        .hero {
            text-align: center;
            margin-bottom: 80px;
        }

        .logo-wrapper {
            display: inline-block;
            position: relative;
            margin-bottom: 32px;
        }

        .logo {
            width: 140px;
            height: 140px;
            border-radius: 20px;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .logo-wrapper:hover .logo {
            transform: scale(1.05) rotate(-2deg);
        }

        .logo-glow {
            position: absolute;
            inset: -20px;
            background: radial-gradient(circle, rgba(255,100,50,0.15) 0%, transparent 70%);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .logo-wrapper:hover .logo-glow {
            opacity: 1;
        }

        .title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 500;
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin-bottom: 12px;
            color: var(--text);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
        }

        .subtitle {
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-muted);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
        }

        /* Projects Grid */
        .projects {
            display: flex;
            flex-direction: column;
            gap: 1px;
            background: var(--border);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 64px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
        }

        .project {
            background: var(--surface);
            padding: 24px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--text);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .project::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255,255,255,0.03) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .project:hover::before {
            opacity: 1;
        }

        .project:hover {
            background: #161616;
            transform: translateX(4px);
        }

        .project-info { flex: 1; position: relative; z-index: 1; }

        .project-name {
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            margin-bottom: 4px;
            transition: color 0.2s ease;
        }

        .project:hover .project-name { color: #fff; }

        .project-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.03em;
        }

        .project-address {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--accent);
            margin-top: 8px;
            padding: 6px 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            display: inline-block;
            letter-spacing: 0.02em;
            transition: all 0.2s ease;
        }

        .project:hover .project-address {
            border-color: #333;
            background: #0d0d0d;
        }

        .project-arrow {
            margin-left: 16px;
            color: var(--text-muted);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), color 0.2s ease;
            position: relative;
            z-index: 1;
        }

        .project:hover .project-arrow {
            transform: translateX(4px);
            color: var(--text);
        }

        .copied .project-address {
            background: var(--accent);
            color: var(--bg);
            border-color: var(--accent);
        }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Video */
        .video {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 64px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
        }

        .video video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        /* Status */
        .status {
            text-align: center;
            margin-bottom: 48px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 100px;
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.02em;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 8px rgba(74, 222, 128, 0.4);
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-badge.degraded .status-dot {
            background: #fbbf24;
            box-shadow: 0 0 8px rgba(251, 191, 36, 0.4);
        }

        .status-badge.unknown .status-dot {
            background: var(--text-muted);
            box-shadow: none;
            animation: none;
        }

        /* Servers (Xray-Checker) */
        .servers {
            margin-bottom: 32px;
        }

        .servers[hidden] { display: none; }

        .servers-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 12px;
            padding: 0 4px;
        }

        .servers-title {
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .servers-updated {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .server-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 1px;
            background: var(--border);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .server-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            background: var(--surface);
            font-size: 0.85rem;
        }

        .server-dot {
            flex: none;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 8px rgba(74, 222, 128, 0.4);
        }

        .server-row.down .server-dot {
            background: #f87171;
            box-shadow: 0 0 8px rgba(248, 113, 113, 0.4);
        }

        .server-flag {
            flex: none;
            display: inline-flex;
            width: 20px;
            height: 14px;
            border-radius: 2px;
            overflow: hidden;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08);
        }

        .server-flag svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        .server-flag.code {
            align-items: center;
            justify-content: center;
            background: var(--border);
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.55rem;
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        .server-name {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .server-latency {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--accent);
            font-variant-numeric: tabular-nums;
        }

        .server-row.down .server-latency { color: #f87171; }

        /* Footer */
        .footer {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.02em;
        }

        .footer a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer a:hover { color: var(--text); }

        /* Floating particles */
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            animation: float linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) rotate(720deg); opacity: 0; }
        }

        /* Magnetic hover for buttons */
        .magnetic {
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Tilt effect on cards */
        .tilt {
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        .tilt-inner {
            transform: translateZ(0);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .tilt:hover .tilt-inner {
            transform: translateZ(20px);
        }
    </style>
</head>
<body>
    <div class="spotlight" id="spotlight"></div>
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="hero">
            <div class="logo-wrapper">
                <div class="logo-glow"></div>
                <img src="logo.png" alt="MARMELAD" class="logo" id="logo">
            </div>
            <h1 class="title">KIRO PROJECT</h1>
            <p class="subtitle">Ecosystem</p>
        </div>

        <div class="projects">
            <a href="https://app.kiroproject.online/" class="project tilt">
                <div class="project-info tilt-inner">
                    <div class="project-name">MARMELAD APP</div>
                    <div class="project-desc">app.kiroproject.online</div>
                </div>
                <svg class="project-arrow" width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M6 4L10 8L6 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>

            <a href="https://github.com/sirbiprod" class="project tilt" target="_blank" rel="noopener">
                <div class="project-info tilt-inner">
                    <div class="project-name">@sirbiprod</div>
                    <div class="project-desc">GitHub</div>
                </div>
                <svg class="project-arrow" width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M6 4L10 8L6 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>

            <a href="https://github.com/kiroproject" class="project tilt" target="_blank" rel="noopener">
                <div class="project-info tilt-inner">
                    <div class="project-name">@kiroproject</div>
                    <div class="project-desc">GitHub</div>
                </div>
                <svg class="project-arrow" width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M6 4L10 8L6 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>

            <div class="project tilt" id="server" onclick="copyAddress()">
                <div class="project-info tilt-inner">
                    <div class="project-name">MARMELAD WORLD</div>
                    <div class="project-desc">Fabric 26.1.2</div>
                    <div class="project-address" id="address">mine.kiroproject.online</div>
                </div>
                <svg class="project-arrow" width="16" height="16" viewBox="0 0 16 16" fill="none" id="copy-icon">
                    <rect x="5" y="5" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M3 11V3H11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </div>

        <div class="video">
            <video controls preload="metadata" playsinline poster="poster.jpg">
                <source src="kiro.mp4" type="video/mp4">
            </video>
        </div>

        <section class="servers" id="servers" hidden aria-labelledby="servers-title">
            <div class="servers-head">
                <span class="servers-title" id="servers-title">Servers</span>
                <span class="servers-updated" id="servers-updated"></span>
            </div>
            <ul class="server-list" id="server-list"></ul>
        </section>

        <div class="status">
            <div class="status-badge magnetic unknown" id="status-badge" role="status" aria-live="polite">
                <div class="status-dot"></div>
                <span id="status-text">Checking status…</span>
            </div>
        </div>

        <div class="footer">
            Made by <a href="https://t.me/sirbiprod">@sirbiprod</a>
        </div>
    </div>

    <script>
        // Cursor spotlight
        const spotlight = document.getElementById('spotlight');
        let mouseX = 0, mouseY = 0;
        let spotX = 0, spotY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function animateSpotlight() {
            spotX += (mouseX - spotX) * 0.15;
            spotY += (mouseY - spotY) * 0.15;
            spotlight.style.left = spotX + 'px';
            spotlight.style.top = spotY + 'px';
            requestAnimationFrame(animateSpotlight);
        }
        animateSpotlight();

        // Project card mouse tracking for radial gradient
        document.querySelectorAll('.project').forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 100;
                const y = ((e.clientY - rect.top) / rect.height) * 100;
                card.style.setProperty('--mouse-x', x + '%');
                card.style.setProperty('--mouse-y', y + '%');
            });
        });

        // Logo parallax on mouse
        const logo = document.getElementById('logo');
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 10;
            const y = (e.clientY / window.innerHeight - 0.5) * 10;
            logo.style.transform = `translate(${x}px, ${y}px)`;
        });

        // Floating particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 20; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDuration = (Math.random() * 20 + 15) + 's';
            particle.style.animationDelay = (Math.random() * 20) + 's';
            particle.style.width = (Math.random() * 2 + 1) + 'px';
            particle.style.height = particle.style.width;
            particlesContainer.appendChild(particle);
        }

        // Magnetic hover effect
        document.querySelectorAll('.magnetic').forEach(el => {
            el.addEventListener('mousemove', (e) => {
                const rect = el.getBoundingClientRect();
                const x = e.clientX - rect.left - rect.width / 2;
                const y = e.clientY - rect.top - rect.height / 2;
                el.style.transform = `translate(${x * 0.2}px, ${y * 0.2}px)`;
            });
            el.addEventListener('mouseleave', () => {
                el.style.transform = 'translate(0, 0)';
            });
        });

        // Tilt effect
        document.querySelectorAll('.tilt').forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width;
                const y = (e.clientY - rect.top) / rect.height;
                const tiltX = (y - 0.5) * 6;
                const tiltY = (x - 0.5) * -6;
                card.style.transform = `perspective(1000px) rotateX(${tiltX}deg) rotateY(${tiltY}deg) translateX(4px)`;
            });
            card.addEventListener('mouseleave', () => {
                card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) translateX(0)';
            });
        });

        // Copy address
        function copyAddress() {
            navigator.clipboard.writeText('mine.kiroproject.online');
            const el = document.getElementById('server');
            const icon = document.getElementById('copy-icon');
            el.classList.add('copied');
            icon.innerHTML = '<path d="M4 8L7 11L12 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>';
            setTimeout(() => {
                el.classList.remove('copied');
                icon.innerHTML = '<rect x="5" y="5" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.5"/><path d="M3 11V3H11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>';
            }, 2000);
        }

        // Server statuses from Xray-Checker (proxied same-origin by nginx: /api/status)
        const serversEl = document.getElementById('servers');
        const listEl = document.getElementById('server-list');
        const updatedEl = document.getElementById('servers-updated');
        const badgeEl = document.getElementById('status-badge');
        const badgeText = document.getElementById('status-text');

        function setBadge(state, text) {
            badgeEl.classList.remove('degraded', 'unknown');
            if (state !== 'ok') badgeEl.classList.add(state);
            badgeText.textContent = text;
        }

        // Emoji flags don't render on Windows, so draw them as inline SVG.
        const FLAGS = {
            NL: '<svg viewBox="0 0 9 6" preserveAspectRatio="xMidYMid slice"><path fill="#21468B" d="M0 0h9v6H0z"/><path fill="#FFF" d="M0 0h9v4H0z"/><path fill="#AE1C28" d="M0 0h9v2H0z"/></svg>',
            FI: '<svg viewBox="0 0 18 11" preserveAspectRatio="xMidYMid slice"><path fill="#FFF" d="M0 0h18v11H0z"/><path fill="#002F6C" d="M0 4h18v3H0zM5 0h3v11H5z"/></svg>',
            DE: '<svg viewBox="0 0 5 3" preserveAspectRatio="xMidYMid slice"><path fill="#FFCE00" d="M0 0h5v3H0z"/><path fill="#D00" d="M0 0h5v2H0z"/><path fill="#000" d="M0 0h5v1H0z"/></svg>'
        };

        // Split "🇳🇱 Нидерланды 2" into country code "NL" and the rest of the name.
        function splitFlag(raw) {
            const name = String(raw || '').trim();
            const m = name.match(/^([\u{1F1E6}-\u{1F1FF}])([\u{1F1E6}-\u{1F1FF}])\s*/u);
            if (!m) return { code: null, name };
            const code = String.fromCharCode(
                m[1].codePointAt(0) - 0x1F1E6 + 65,
                m[2].codePointAt(0) - 0x1F1E6 + 65
            );
            return { code, name: name.slice(m[0].length).trim() };
        }

        function flagEl(code) {
            const el = document.createElement('span');
            el.className = 'server-flag';
            el.setAttribute('aria-hidden', 'true');
            if (FLAGS[code]) {
                el.innerHTML = FLAGS[code];
            } else {
                el.classList.add('code');
                el.textContent = code;
            }
            return el;
        }

        function ago(unixSec) {
            const s = Math.max(0, Math.round(Date.now() / 1000 - unixSec));
            if (s < 60) return s + 's ago';
            return Math.round(s / 60) + 'm ago';
        }

        async function loadStatus() {
            try {
                const res = await fetch('/api/status', { cache: 'no-store' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const json = await res.json();
                const items = Array.isArray(json && json.data) ? json.data : [];
                if (!items.length) throw new Error('empty');

                const rows = items.map(p => ({ p, ...splitFlag(p.name) }));
                rows.sort((a, b) => a.name.localeCompare(b.name, 'ru'));
                listEl.replaceChildren(...rows.map(({ p, code, name: label }) => {
                    const li = document.createElement('li');
                    li.className = 'server-row' + (p.online ? '' : ' down');
                    const dot = document.createElement('span');
                    dot.className = 'server-dot';
                    const name = document.createElement('span');
                    name.className = 'server-name';
                    name.textContent = label;
                    const lat = document.createElement('span');
                    lat.className = 'server-latency';
                    lat.textContent = p.online ? Math.round(p.latencyMs) + ' ms' : 'offline';
                    if (code) li.append(dot, flagEl(code), name, lat);
                    else li.append(dot, name, lat);
                    return li;
                }));

                const up = items.filter(p => p.online).length;
                const last = Math.max(...items.map(p => Number(p.lastCheck) || 0));
                updatedEl.textContent = last ? 'checked ' + ago(last) : '';
                serversEl.hidden = false;

                if (up === items.length) setBadge('ok', 'All systems operational');
                else if (up === 0) setBadge('degraded', 'All servers are down');
                else setBadge('degraded', 'Partial outage · ' + up + '/' + items.length + ' online');
            } catch (e) {
                setBadge('unknown', 'Status unavailable');
            }
        }

        loadStatus();
        setInterval(() => { if (!document.hidden) loadStatus(); }, 60000);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) loadStatus(); });

        // Reduced motion
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            document.querySelectorAll('.particle').forEach(p => p.remove());
            spotlight.style.display = 'none';
        }
    </script>
</body>
</html>
